name: GitHub to GitHub Migration [GEI]

on:
  workflow_call:
    secrets:
      TARGET_ADMIN_TOKEN:
        required: true
      SOURCE_ADMIN_TOKEN:
        required: true

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.build-matrix.outputs.repositories }}
      parsed-issue: ${{ steps.parse-issue-body.outputs.jsonString }}
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/run-gei-migration')
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue body
        id: parse-issue-body
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/github-enterprise-cloud-migration.yml

      - name: Log parsed issue json
        run: echo "$JSON_STRING"
        env:
          JSON_STRING: ${{ steps.parse-issue-body.outputs.jsonString }}

      - name: Add migration comment
        uses: actions/github-script@v6
        with:
          script: |
            const body = `:hourglass: **GitHub to GitHub migration in progress.** [View workflow run for details](${context.payload.repository.html_url}/actions/runs/${context.runId})`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

      - name: Build matrix
        id: build-matrix
        uses: actions/github-script@v6
        with:
          script: |
            const raw = (process.env.REPOSITORIES || '')
              .split('\n')
              .map(line => line.trim())
              .filter(Boolean);

            if (!raw.length) {
              core.setFailed('No repository mappings were provided.');
              return;
            }

            const mappings = raw.map((line, index) => {
              const parts = line.split(',').map(part => part.trim()).filter(Boolean);
              if (parts.length !== 2) {
                throw new Error(`Line ${index + 1} must be in the format "source-repo,target-repo". Received: "${line}"`);
              }
              return { sourceRepo: parts[0], targetRepo: parts[1] };
            });

            core.setOutput('repositories', JSON.stringify(mappings));
        env:
          REPOSITORIES: ${{ steps.parse-issue-body.outputs.issueparser_repositories }}

  migrate:
    name: Run migrations
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        repository: ${{ fromJson(needs.prepare.outputs.repositories) }}
      fail-fast: false
      max-parallel: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue body
        id: parse-issue-body
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/github-enterprise-cloud-migration.yml

      - name: Authenticate gh CLI
#       run: |
#           unset GITHUB_TOKEN
#           unset GH_TOKEN
#           if ! gh auth status >/dev/null 2>&1; then
#             echo "${ENV_GH_TOKEN}" | gh auth login --with-token --hostname github.com
#           HOSTNAME="github.com"
#           if [ -n "${GHE_SUBDOMAIN}" ]; then
#             HOSTNAME="api.${GHE_SUBDOMAIN}.ghe.com"
#           fi
#           if ! gh auth status --hostname "${HOSTNAME}" >/dev/null 2>&1; then
#             echo "${ENV_GH_TOKEN}" | gh auth login --with-token --hostname "${HOSTNAME}"
#           fi
#         env:
#           ENV_GH_TOKEN: ${{ secrets.TARGET_ADMIN_TOKEN }}
#           GHE_SUBDOMAIN: ${{ steps.parse-issue-body.outputs.issueparser_ghe_subdomain }}
        run: |
          unset GITHUB_TOKEN
          unset GH_TOKEN

          # Strip any existing api. prefix and .ghe.com suffix from user input
          CLEANED_SUBDOMAIN="${GHE_SUBDOMAIN#api.}"
          CLEANED_SUBDOMAIN="${CLEANED_SUBDOMAIN%.ghe.com}"

          HOSTNAME="github.com"
          if [ -n "${CLEANED_SUBDOMAIN}" ]; then
            HOSTNAME="api.${CLEANED_SUBDOMAIN}.ghe.com"
          fi
          if ! gh auth status --hostname "${HOSTNAME}" >/dev/null 2>&1; then
            echo "${ENV_GH_TOKEN}" | gh auth login --with-token --hostname "${HOSTNAME}"
          fi
        env:
          ENV_GH_TOKEN: ${{ secrets.TARGET_ADMIN_TOKEN }}
          GHE_SUBDOMAIN: ${{ steps.parse-issue-body.outputs.issueparser_ghe_subdomain }}

      - name: Install gei extension
        run: gh extension install github/gh-gei --force
        env:
          GH_TOKEN: ${{ secrets.TARGET_ADMIN_TOKEN }}

      - name: Migrate repository
        env:
          GH_TOKEN: ${{ secrets.TARGET_ADMIN_TOKEN }}
          GH_PAT: ${{ secrets.TARGET_ADMIN_TOKEN }}
          GH_SOURCE_PAT: ${{ secrets.SOURCE_ADMIN_TOKEN }}
          GITHUB_SOURCE_ORG: ${{ steps.parse-issue-body.outputs.issueparser_github_source_organization }}
          SOURCE_REPO: ${{ matrix.repository.sourceRepo }}
          GITHUB_TARGET_ORG: ${{ steps.parse-issue-body.outputs.issueparser_github_target_organization }}
          TARGET_REPO: ${{ matrix.repository.targetRepo }}
          GHE_SUBDOMAIN: ${{ steps.parse-issue-body.outputs.issueparser_ghe_subdomain }}
        run: |
          gh auth setup-git

          # Strip any existing api. prefix and .ghe.com suffix from user input
          CLEANED_SUBDOMAIN="${GHE_SUBDOMAIN#api.}"
          CLEANED_SUBDOMAIN="${CLEANED_SUBDOMAIN%.ghe.com}"

          ARGS=""
          if [ -n "$CLEANED_SUBDOMAIN" ]; then
            export TARGET_API_URL="https://api.${CLEANED_SUBDOMAIN}.ghe.com"
            ARGS="$ARGS --target-api-url ${TARGET_API_URL}"
          fi

          // Echo the value of TARGET_API_URL for debugging
          echo "TARGET_API_URL is set to: '${TARGET_API_URL}'"

          gh gei migrate-repo \
            --github-source-org "${GITHUB_SOURCE_ORG}" \
            --source-repo "${SOURCE_REPO}" \
            --github-target-org "${GITHUB_TARGET_ORG}" \
            --target-repo "${TARGET_REPO}" \
            $ARGS 

      - name: Write repo migration status
        if: always()
        id: write-status
        env:
          SOURCE_REPO: ${{ matrix.repository.sourceRepo }}
          TARGET_REPO: ${{ matrix.repository.targetRepo }}
          JOB_STATUS: ${{ job.status }}
        run: |
          label="${SOURCE_REPO} -> ${TARGET_REPO}"
          filename="$(echo "${TARGET_REPO}" | tr '[:upper:]' '[:lower:]').txt"
          echo "repo-label=${label}" >> "$GITHUB_OUTPUT"
          echo "status-file=${filename}" >> "$GITHUB_OUTPUT"
          echo "${SOURCE_REPO},${TARGET_REPO},${JOB_STATUS}" > "${filename}"

      - name: Upload repo migration status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-status-${{ matrix.repository.targetRepo }}
          path: ${{ steps.write-status.outputs.status-file }}
          if-no-files-found: error

  report-failure:
    name: Report Failure
    runs-on: ubuntu-latest
    needs: [prepare, migrate]
    if: failure()
    steps:
      - uses: actions/download-artifact@v4
        id: download-artifact
        with:
          pattern: migration-status-*
          merge-multiple: true
          path: statuses

      - name: Get failed repositories
        id: get-failed-repos
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const failedRepos = [];

            for (const file of fs.readdirSync('statuses')) {
              if (path.extname(file) !== '.txt') continue;

              const [sourceRepo, targetRepo, status] = fs.readFileSync(path.join('statuses', file), 'utf-8')
                .split(',')
                .map(segment => segment.trim());

              if ((status || '').toLowerCase() !== 'success') {
                failedRepos.push(`${sourceRepo} -> ${targetRepo}`);
              }
            }

            core.setOutput('failed-repos', failedRepos.join('\n'));

      - name: Report failed migration
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const repositories = `${{ steps.get-failed-repos.outputs['failed-repos'] }}`.trim();
            let body = `:no_entry: **GitHub to GitHub migration failed.** [View workflow run for details](${context.payload.repository.html_url}/actions/runs/${context.runId})`;

            if ('${{ steps.download-artifact.conclusion }}' === 'success' && repositories) {
              const lines = repositories.split('\n');
              body += `\n\n${lines.length} repo mapping(s) failed:\n\`\`\`\n${repositories}\n\`\`\``;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

  report-success:
    name: Report Success
    runs-on: ubuntu-latest
    needs: [prepare, migrate]
    if: success()
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            const body = `:tada: **GitHub to GitHub migration succeeded.** [View workflow run for details](${context.payload.repository.html_url}/actions/runs/${context.runId})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })
